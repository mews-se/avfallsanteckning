name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m unittest discover -s tests -v

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t avfallsanteckning:ci .

      - name: Starts and serves
        run: |
          docker run -d --name app -p 8400:8400 -v "$PWD/ci-data:/data" avfallsanteckning:ci
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8400/healthz && exit 0
            sleep 2
          done
          docker logs app
          exit 1
